trigger: none

pool: appmanoj

stages:
  - stage: Build
    jobs:
      - job: 
        steps:
          - task: NodeTaskRunnerInstaller@0
            inputs:
              nodeVersion: '6'
          - task: Npm@1
            inputs:
              command: 'install'
          - task: Npm@1
            inputs:
              command: 'custom'
              customCommand: 'run build'
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  - stage: sonarqubeanaylsis
    displayName: sonarqubeScan
    jobs:
      - job: 
        steps:
         - task: SonarQubePrepare@8
           inputs:
             SonarQube: 'sonarq'
             scannerMode: 'cli'
             configMode: 'manual'
             cliProjectKey: 'bankapp'
             cliProjectName: 'bankapp'
             cliSources: '.'
         - task: SonarQubeAnalyze@8
           inputs:
             jdkversion: 'JAVA_HOME_17_X64'

